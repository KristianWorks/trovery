<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="Trovery">
  <title>Trovery</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&amp;display=swap');
      .tv-mark { fill: #B8732C; }
      .tv-mark-outline { fill: none; stroke: #B8732C; stroke-width: 2.4; }
      .tv-word {
        font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 38px;
        fill: #B8732C;
        font-variation-settings: "opsz" 96, "SOFT" 60, "WONK" 1;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>

  <!-- Geometric mark: stacked diamonds (a filled tile sitting under an outlined tile) -->
  <!-- Suggests layering, provenance, "trove" — minimal, no gradient, no 3D -->
  <g transform="translate(32 32)">
    <rect class="tv-mark-outline" x="-14" y="-14" width="28" height="28" transform="rotate(45)" rx="1.5"/>
    <rect class="tv-mark"         x="-8"  y="-8"  width="16" height="16" transform="rotate(45)" rx="1"/>
  </g>

  <!-- Wordmark -->
  <text class="tv-word" x="64" y="44">trovery</text>
</svg>
